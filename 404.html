<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — HAZIK</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#14171f;--muted:#5b6272;--line:#dcdfe6;--accent:#2f45e8;--accent-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--surface:#151923;--ink:#e9ebf2;--muted:#9097a8;--line:#262c3d;--accent:#8b9aff;--accent-ink:#0e1118}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;padding:20px}
.dots{position:fixed;inset:0;pointer-events:none}
.dots i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.25;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(110vh) scale(.6)}to{transform:translateY(-10vh) scale(1.4)}}
.box{position:relative;text-align:center;max-width:460px}
.num{display:flex;justify-content:center;gap:6px;font:800 clamp(90px,24vw,150px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.num span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.num span:nth-child(2){animation-delay:.3s;color:var(--accent)}
.num span:nth-child(3){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
h1{font:700 26px/1.2 "Bricolage Grotesque",sans-serif;margin:8px 0}
p{color:var(--muted);margin:0 0 20px}
.ring{position:relative;width:96px;height:96px;margin:0 auto 18px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .arc{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 28px "Bricolage Grotesque",sans-serif}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:10px;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="dots" id="dots" aria-hidden="true"></div>
<main class="box">
  <div class="num" aria-label="404"><span>4</span><span>0</span><span>4</span></div>
  <h1>This page doesn't exist</h1>
  <p>Taking you back to the main page in <b id="s">10</b> seconds.</p>
  <div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="42"/><circle class="arc" id="arc" cx="48" cy="48" r="42"/></svg><b id="n">10</b></div>
  <a class="btn" href="/">Go to main page now</a>
</main>
<script>
// /upload has no real file on GitHub Pages: send it to the upload page right away
if(/\/upload\/?$/i.test(location.pathname)){location.replace("/#upload")}
const D=document.getElementById("dots");
for(let i=0;i<14;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.animationDuration=8+Math.random()*10+"s";e.style.animationDelay=-Math.random()*14+"s";D.appendChild(e)}
let t=10;const C=2*Math.PI*42,arc=document.getElementById("arc");arc.style.strokeDasharray=C;
const paint=()=>{arc.style.strokeDashoffset=C*t/10;document.getElementById("n").textContent=t;document.getElementById("s").textContent=t};
paint();
const iv=setInterval(()=>{t--;paint();if(t<=0){clearInterval(iv);location.replace("/")}},1000);
</script>
</body>
</html>
